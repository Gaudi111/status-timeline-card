name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, catches new HACS checks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-24.04          # pinned: avoids the ubuntu-latest -> 26 migration notice
    steps:
      # No actions/checkout needed: hacs/action validates the repository through the GitHub API.
      # (Removing it also removes the "Node.js 20 is deprecated" warning.)
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
